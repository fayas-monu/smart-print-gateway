<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Print Gateway - Enterprise Print Portal</title>
    <!-- PDF.js library for high-speed client-side rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <style>
        :root {
            --primary: #1a73e8;
            --primary-dark: #1557b0;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #202124;
            --text-secondary: #5f6368;
            --border-color: #dadce0;
        }

        body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 20px; background-color: var(--bg-color); color: var(--text-main); }
        .app-container { max-width: 1200px; margin: auto; display: grid; grid-template-columns: 420px 1fr; gap: 20px; }
        @media (max-width: 900px) { .app-container { grid-template-columns: 1fr; } }

        /* Card Container Styling */
        .card { background: var(--card-bg); padding: 20px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h2 { color: var(--primary); margin-top: 0; font-size: 20px; border-bottom: 2px solid #f1f3f4; padding-bottom: 10px; display: flex; align-items: center; gap: 8px; }
        
        .form-group { margin-bottom: 14px; }
        label { font-weight: 600; display: block; margin-bottom: 5px; font-size: 12px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }
        input[type="text"], input[type="number"], select, input[type="file"] { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border-color); box-sizing: border-box; font-size: 14px; background: #fff; transition: border 0.2s; }
        input:focus, select:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 2px rgba(26,115,232,0.2); }

        .row { display: flex; gap: 10px; }
        .col { flex: 1; }

        /* Live Preview Workspace */
        .preview-pane { display: flex; flex-direction: column; height: 100%; }
        .preview-toolbar { display: flex; justify-content: space-between; align-items: center; background: #e8eaed; padding: 8px 12px; border-radius: 6px 6px 0 0; font-size: 13px; font-weight: 600; color: var(--text-secondary); }
        .preview-container { flex-grow: 1; min-height: 480px; border: 2px dashed var(--border-color); border-radius: 0 0 8px 8px; background: #3c4043; display: flex; align-items: center; justify-content: center; overflow: auto; position: relative; padding: 20px; }
        
        /* Dynamic Filters & Transforms */
        .grayscale-preview { filter: grayscale(100%) contrast(130%) brightness(105%); }
        #previewCanvas, #previewImage { max-width: 100%; max-height: 100%; box-shadow: 0 8px 24px rgba(0,0,0,0.3); background: white; transition: transform 0.3s ease; }
        .grid-preview-box { display: grid; gap: 6px; background: white; padding: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.3); }

        /* Page Navigation Control Bar */
        .page-nav-bar { display: flex; justify-content: center; align-items: center; gap: 12px; margin-top: 12px; background: #f8f9fa; padding: 8px; border-radius: 6px; border: 1px solid var(--border-color); }
        .nav-btn { padding: 6px 12px; background: var(--primary); color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; }
        .nav-btn:disabled { background: #bdc1c6; cursor: not-allowed; }

        .submit-btn { width: 100%; padding: 14px; background-color: #28a745; color: white; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; font-size: 15px; margin-top: 15px; transition: background 0.2s; text-transform: uppercase; letter-spacing: 0.5px; }
        .submit-btn:hover { background-color: #218838; }
        
        .badge { background: #e8f0fe; color: var(--primary); padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Left Panel: A-Z Professional Print Controls -->
    <div class="card">
        <h2>🖨️ Smart Print Gateway</h2>
        <form id="printForm">
            
            <div class="form-group">
                <label for="custName">Customer Full Name</label>
                <input type="text" id="custName" required placeholder="Enter customer name">
            </div>

            <div class="form-group">
                <label for="fileInput">Select Document / Image (PDF, JPG, PNG)</label>
                <input type="file" id="fileInput" accept=".pdf, image/*" required>
            </div>

            <div class="row">
                <div class="col form-group">
                    <label for="paperSize">Paper Size</label>
                    <select id="paperSize">
                        <option value="A4">A4 (210 x 297 mm)</option>
                        <option value="A3">A3 (297 x 420 mm)</option>
                        <option value="Letter">US Letter</option>
                        <option value="Legal">US Legal</option>
                    </select>
                </div>
                <div class="col form-group">
                    <label for="colorType">Color Mode</label>
                    <select id="colorType">
                        <option value="BW">Black & White (Grayscale)</option>
                        <option value="Color">Full Color</option>
                    </select>
                </div>
            </div>

            <div class="row">
                <div class="col form-group">
                    <label for="orientation">Orientation</label>
                    <select id="orientation">
                        <option value="portrait">Portrait</option>
                        <option value="landscape">Landscape</option>
                    </select>
                </div>
                <div class="col form-group">
                    <label for="scale">Scaling / Zoom</label>
                    <select id="scale">
                        <option value="100">100% (Actual Size)</option>
                        <option value="fit">Fit to Printable Area</option>
                        <option value="75">75% (Shrink)</option>
                        <option value="50">50% (Half Size)</option>
                        <option value="custom">Custom Scale</option>
                    </select>
                </div>
            </div>

            <div class="row">
                <div class="col form-group">
                    <label for="copies">Number of Copies</label>
                    <input type="number" id="copies" value="1" min="1" max="99" required>
                </div>
                <div class="col form-group">
                    <label for="collate">Collation</label>
                    <select id="collate">
                        <option value="yes">Collated (1,2,3 - 1,2,3)</option>
                        <option value="no">Uncollated (1,1,1 - 2,2,2)</option>
                    </select>
                </div>
            </div>

            <div class="row">
                <div class="col form-group">
                    <label for="layout">N-Up Layout (Pages/Sheet)</label>
                    <select id="layout">
                        <option value="1">1 Page per Sheet</option>
                        <option value="2">2 Pages per Sheet</option>
                        <option value="4">4 Pages (2x2 Grid)</option>
                        <option value="6">6 Pages per Sheet</option>
                        <option value="9">9 Pages per Sheet</option>
                    </select>
                </div>
                <div class="col form-group">
                    <label for="printSide">Duplex Printing</label>
                    <select id="printSide">
                        <option value="Single">Single Sided</option>
                        <option value="Double-Long">Double Sided (Long Edge)</option>
                        <option value="Double-Short">Double Sided (Short Edge)</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="pageRange">PDF Page Range / Selection</label>
                <input type="text" id="pageRange" placeholder="e.g. All, 1-5, 2, 4, 7-10">
                <small style="color:var(--text-secondary); font-size:11px;">Specify pages or ranges separated by commas.</small>
            </div>

            <button type="submit" class="submit-btn">Transmit Print Job to Server</button>
        </form>
    </div>

    <!-- Right Panel: Advanced Real-time Interactive Preview -->
    <div class="card preview-pane">
        <h2><span>Live Visual Output Preview</span> <span class="badge" id="printerBadge">Canon Ready</span></h2>
        
        <div class="preview-toolbar">
            <span id="fileStatusInfo">No file loaded</span>
            <span id="dimInfo">Dimensions: --</span>
        </div>

        <div class="preview-container" id="previewBox">
            <span style="color: #9aa0a6; font-size: 14px; text-align: center;" id="placeholderText">Upload a document to render instant real-time layout preview</span>
            <canvas id="previewCanvas" style="display:none;"></canvas>
            <img id="previewImage" style="display:none;" alt="Preview">
            <div id="gridPreview" class="grid-preview-box" style="display:none;"></div>
        </div>

        <!-- Page Navigation Controller -->
        <div class="page-nav-bar" id="pdfControls" style="display:none;">
            <button type="button" class="nav-btn" id="prevPage">◀ Prev Page</button>
            <span id="pageNumDisplay" style="font-weight:700; font-size:13px;">Page 1 of 1</span>
            <button type="button" class="nav-btn" id="nextPage">Next Page ▶</button>
        </div>
    </div>
</div>

<!-- Developed for Smart Print Gateway | Credit: chank!nd3 p4d4y41! -->
<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    const fileInput = document.getElementById('fileInput');
    const colorType = document.getElementById('colorType');
    const orientation = document.getElementById('orientation');
    const layout = document.getElementById('layout');
    const scaleSelect = document.getElementById('scale');
    const paperSize = document.getElementById('paperSize');
    const pageRangeInput = document.getElementById('pageRange');
    
    const canvas = document.getElementById('previewCanvas');
    const ctx = canvas.getContext('2d');
    const previewImg = document.getElementById('previewImage');
    const gridPreview = document.getElementById('gridPreview');
    const placeholderText = document.getElementById('placeholderText');
    const pdfControls = document.getElementById('pdfControls');
    const fileStatusInfo = document.getElementById('fileStatusInfo');
    const dimInfo = document.getElementById('dimInfo');
    
    let currentPdf = null;
    let pageNum = 1;
    let currentFile = null;

    fileInput.addEventListener('change', function(e) {
        currentFile = e.target.files[0];
        if (!currentFile) return;

        placeholderText.style.display = 'none';
        fileStatusInfo.innerText = currentFile.name;
        
        if (currentFile.type === 'application/pdf') {
            const fileReader = new FileReader();
            fileReader.onload = function() {
                const typedarray = new Uint8Array(this.result);
                pdfjsLib.getDocument(typedarray).promise.then(pdf => {
                    currentPdf = pdf;
                    pageNum = 1;
                    pdfControls.style.display = 'flex';
                    renderPdfPage(pageNum);
                });
            };
            fileReader.readAsArrayBuffer(currentFile);
        } else if (currentFile.type.startsWith('image/')) {
            currentPdf = null;
            pdfControls.style.display = 'none';
            const reader = new FileReader();
            reader.onload = function(event) {
                previewImg.src = event.target.result;
                previewImg.onload = function() {
                    dimInfo.innerText = `Size: ${previewImg.naturalWidth} x ${previewImg.naturalHeight}px`;
                };
                updatePreviewDisplay();
            };
            reader.readAsDataURL(currentFile);
        }
    });

    function renderPdfPage(num) {
        currentPdf.getPage(num).then(page => {
            let scaleVal = scaleSelect.value === 'fit' ? 1.2 : parseFloat(scaleSelect.value)/100;
            let viewport = page.getViewport({ scale: scaleVal });
            
            canvas.height = viewport.height;
            canvas.width = viewport.width;
            dimInfo.innerText = `PDF Page Size: ${Math.round(viewport.width)} x ${Math.round(viewport.height)}pt`;

            const renderContext = { canvasContext: ctx, viewport: viewport };
            page.render(renderContext).promise.then(() => {
                updatePreviewDisplay();
            });
            document.getElementById('pageNumDisplay').innerText = `Page ${num} of ${currentPdf.numPages}`;
            
            document.getElementById('prevPage').disabled = (num <= 1);
            document.getElementById('nextPage').disabled = (num >= currentPdf.numPages);
        });
    }

    document.getElementById('prevPage').addEventListener('click', () => {
        if (currentPdf && pageNum > 1) { pageNum--; renderPdfPage(pageNum); }
    });
    document.getElementById('nextPage').addEventListener('click', () => {
        if (currentPdf && pageNum < currentPdf.numPages) { pageNum++; renderPdfPage(pageNum); }
    });

    pageRangeInput.addEventListener('change', function() {
        if (currentPdf) {
            let val = parseInt(this.value.trim());
            if (!isNaN(val) && val >= 1 && val <= currentPdf.numPages) {
                pageNum = val;
                renderPdfPage(pageNum);
            }
        }
    });

    function updatePreviewDisplay() {
        const isBW = colorType.value === 'BW';
        const orient = orientation.value;
        const gridCount = parseInt(layout.value);
        const selectedPaper = paperSize.value;

        // Apply Grayscale Filter Live
        [canvas, previewImg, gridPreview].forEach(el => {
            if (isBW) el.classList.add('grayscale-preview');
            else el.classList.remove('grayscale-preview');
        });

        // Apply Orientation Rotation
        const rotTransform = orient === 'landscape' ? 'rotate(90deg)' : 'none';

        if (currentFile && currentFile.type.startsWith('image/')) {
            if (gridCount > 1) {
                previewImg.style.display = 'none';
                canvas.style.display = 'none';
                gridPreview.style.display = 'grid';
                gridPreview.innerHTML = '';
                
                let cols = gridCount === 2 ? 2 : gridCount === 4 ? 2 : 3;
                gridPreview.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
                
                for(let i=0; i<gridCount; i++) {
                    let img = document.createElement('img');
                    img.src = previewImg.src;
                    img.style.width = '100%';
                    img.style.height = orient === 'landscape' ? '70px' : '100px';
                    img.style.objectFit = 'contain';
                    if(isBW) img.classList.add('grayscale-preview');
                    gridPreview.appendChild(img);
                }
            } else {
                gridPreview.style.display = 'none';
                canvas.style.display = 'none';
                previewImg.style.display = 'block';
                previewImg.style.transform = rotTransform;
            }
        } else if (currentPdf) {
            gridPreview.style.display = 'none';
            previewImg.style.display = 'none';
            canvas.style.display = 'block';
            canvas.style.transform = rotTransform;
        }
    }

    // Live Change Listeners for instant preview reactivity
    colorType.addEventListener('change', updatePreviewDisplay);
    orientation.addEventListener('change', updatePreviewDisplay);
    layout.addEventListener('change', updatePreviewDisplay);
    paperSize.addEventListener('change', updatePreviewDisplay);
    scaleSelect.addEventListener('change', () => { if (currentPdf) renderPdfPage(pageNum); });

    document.getElementById('printForm').addEventListener('submit', function(e) {
        e.preventDefault();
        alert('Print job successfully queued and transmitted to Smart Print Gateway backend!');
    });
</script>

</body>
</html>
