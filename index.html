<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Stationery Print Portal</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 15px; background-color: #f8f9fa; color: #333; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #1a73e8; margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        label { font-weight: bold; display: block; margin-bottom: 5px; font-size: 13px; color: #555; }
        input[type="text"], input[type="number"], select, input[type="file"] { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #ddd; box-sizing: border-box; font-size: 14px; }
        
        /* Live Preview Box */
        .preview-container { width: 100%; height: 250px; border: 2px dashed #ccc; border-radius: 8px; background: #f1f3f4; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; margin-bottom: 15px; }
        .preview-container img, .preview-container canvas { max-width: 100%; max-height: 100%; object-fit: contain; }
        .placeholder-text { color: #888; font-size: 14px; text-align: center; }

        .row { display: flex; gap: 10px; }
        .col { flex: 1; }

        button { width: 100%; padding: 12px; background-color: #1a73e8; color: white; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; margin-top: 10px; transition: background 0.2s; }
        button:hover { background-color: #1557b0; }
    </style>
</head>
<body>

<div class="container">
    <h2>🖨️ Smart Print & Preview</h2>
    
    <form id="printForm">
        <div class="form-group">
            <label for="custName">Your Name:</label>
            <input type="text" id="custName" required placeholder="Enter your name">
        </div>

        <div class="form-group">
            <label for="fileInput">Select File (PDF / Image):</label>
            <input type="file" id="fileInput" accept=".pdf, image/*" required>
        </div>

        <!-- Live Preview Screen -->
        <label>Live Output Preview:</label>
        <div class="preview-container" id="previewBox">
            <span class="placeholder-text">Preview will appear here after selecting a file</span>
        </div>

        <div class="row">
            <div class="col form-group">
                <label for="copies">Number of Copies:</label>
                <input type="number" id="copies" value="1" min="1" required>
            </div>
            <div class="col form-group">
                <label for="scale">Size / Scale (%):</label>
                <select id="scale">
                    <option value="100">100% (Normal)</option>
                    <option value="75">75% (Shrink)</option>
                    <option value="50">50% (Half size)</option>
                    <option value="fit">Fit to Page</option>
                </select>
            </div>
        </div>

        <div class="row">
            <div class="col form-group">
                <label for="colorType">Print Type:</label>
                <select id="colorType">
                    <option value="BW">Black & White</option>
                    <option value="Color">Color</option>
                </select>
            </div>
            <div class="col form-group">
                <label for="layout">Paper Layout:</label>
                <select id="layout">
                    <option value="1">1 Image per Page</option>
                    <option value="2">2 Images per Page</option>
                    <option value="4">4 Images per Page (Grid)</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label for="printSide">Paper Side:</label>
            <select id="printSide">
                <option value="Single">Single Side</option>
                <option value="Double">Double Side (Duplex)</option>
            </select>
        </div>

        <button type="submit">Send Print Request to Counter</button>
    </form>
</div>

<script>
    const fileInput = document.getElementById('fileInput');
    const previewBox = document.getElementById('previewBox');

    // Live preview handler for uploaded files
    fileInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        previewBox.innerHTML = ''; // Clear previous preview

        if (file.type.startsWith('image/')) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = document.createElement('img');
                img.src = event.target.result;
                previewBox.appendChild(img);
            }
            reader.readAsDataURL(file);
        } else if (file.type === 'application/pdf') {
            const p = document.createElement('p');
            p.style.textAlign = 'center';
            p.style.color = '#333';
            p.innerHTML = `📄 <b>${file.name}</b><br><span style="font-size:12px; color:#666;">PDF file uploaded successfully. Full preview will be available in the admin panel.</span>`;
            previewBox.appendChild(p);
        }
    });

    document.getElementById('printForm').addEventListener('submit', function(e) {
        e.preventDefault();
        alert('Your print request has been submitted successfully! Please wait at the counter.');
    });
</script>

</body>
</html>
